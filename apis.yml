name: Fleetzero
description: Fleetzero is a Houston-based maritime technology company, founded in 2021 and led by U.S. Navy
  veterans and shipping-industry experts, building battery-electric energy and robotics systems to decarbonize
  ocean shipping at cost parity with fossil fuels. Its Leviathan modular marine energy storage system,
  3.8 MWh marine battery containers, and 55 MWh battery barges provide propulsion power and mobile charging
  infrastructure for cargo vessels. Backed by Obvious Ventures, Fleetzero was added to the API Evangelist
  network as a portfolio-lead stub; it currently publishes no public developer, API, or documentation
  surface, so this profile carries company identity and infrastructure signals only.
